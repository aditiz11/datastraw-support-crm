<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SupportDesk CRM</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body class="bg-slate-50 text-slate-900">

    <div class="min-h-screen">

        <!-- Header -->
        <header class="bg-white border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-6 py-5">

                <div class="flex items-center justify-between">

                    <div>
                        <h1 class="text-2xl font-bold">
                            SupportDesk
                        </h1>

                        <p class="text-sm text-slate-500 mt-1">
                            Customer support ticket management
                        </p>
                    </div>

                    <button
                        id="new-ticket-btn"
                        class="bg-slate-900 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-slate-800 transition"
                    >
                        + New Ticket
                    </button>

                </div>

            </div>
        </header>


        <!-- Main -->
        <main class="max-w-7xl mx-auto px-6 py-8">

            <!-- Statistics -->
            <section
                id="stats"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"
            >

                <div class="bg-white rounded-xl border border-slate-200 p-5">
                    <p class="text-sm text-slate-500">
                        Total Tickets
                    </p>

                    <p
                        id="total-count"
                        class="text-3xl font-bold mt-2"
                    >
                        0
                    </p>
                </div>


                <div class="bg-white rounded-xl border border-slate-200 p-5">
                    <p class="text-sm text-slate-500">
                        Open
                    </p>

                    <p
                        id="open-count"
                        class="text-3xl font-bold mt-2"
                    >
                        0
                    </p>
                </div>


                <div class="bg-white rounded-xl border border-slate-200 p-5">
                    <p class="text-sm text-slate-500">
                        In Progress
                    </p>

                    <p
                        id="progress-count"
                        class="text-3xl font-bold mt-2"
                    >
                        0
                    </p>
                </div>


                <div class="bg-white rounded-xl border border-slate-200 p-5">
                    <p class="text-sm text-slate-500">
                        Closed
                    </p>

                    <p
                        id="closed-count"
                        class="text-3xl font-bold mt-2"
                    >
                        0
                    </p>
                </div>

            </section>


            <!-- Search + Filter -->
            <section class="bg-white rounded-xl border border-slate-200 p-4 mb-5">

                <div class="flex flex-col md:flex-row gap-3">

                    <div class="flex-1">

                        <input
                            id="search-input"
                            type="text"
                            placeholder="Search by ticket ID, customer, email, subject..."
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-slate-300"
                        >

                    </div>


                    <select
                        id="status-filter"
                        class="px-4 py-3 border border-slate-300 rounded-lg bg-white outline-none"
                    >
                        <option value="">All Statuses</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>

                </div>

            </section>


            <!-- Ticket Table -->
            <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">

                <div class="px-6 py-5 border-b border-slate-200">

                    <h2 class="font-semibold text-lg">
                        Tickets
                    </h2>

                </div>


                <div class="overflow-x-auto">

                    <table class="w-full">

                        <thead class="bg-slate-50">

                            <tr>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">
                                    ID
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">
                                    Customer
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">
                                    Subject
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">
                                    Priority
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">
                                    Status
                                </th>

                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">
                                    Date
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="ticket-table-body"
                            class="divide-y divide-slate-100"
                        >
                            <tr>
                                <td
                                    colspan="5"
                                    class="text-center py-12 text-slate-500"
                                >
                                    Loading tickets...
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>


                <div
                    id="empty-state"
                    class="hidden text-center py-16"
                >
                    <p class="text-slate-500">
                        No tickets found.
                    </p>
                </div>

            </section>

        </main>

    </div>


    <script src="/static/js/app.js"></script>

</body>
</html>
